# Tomcat Manager properties

# create catalina.base property in nbproject/private/private.properties with a path to your local Tomcat directory
catalina.home=${catalina.base}

# username, password typically set in nbproject/private/private.properties 
# username=tomcat
# password=tomcat

tomcat.server=localhost
tomcat.port=8080
# Since Tomcat 7, note that the URL for the text interface has changed from "/manager" to "/manager/text".
mgr=http://${tomcat.server}:${tomcat.port}/manager/text

proj.name=${app.name}
context=/${proj.name}

dist.war=${dist}/${app.name}.war
